name: Build and publish images

on:
  push:
    branches: [main, rewrite/go-stack]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beez-trackz-api:latest
            ghcr.io/${{ github.repository_owner }}/beez-trackz-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beez-trackz-web:latest
            ghcr.io/${{ github.repository_owner }}/beez-trackz-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  notify-dockhand:
    needs: [api, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dockhand redeploy
        continue-on-error: true
        run: |
          curl -sS -X POST "${{ vars.DOCKHAND_WEBHOOK_URL || 'https://dock.adventureintandem.com/api/git/stacks/beez-trackz/webhook' }}" \
            || echo "Dockhand webhook returned non-200 (may need configuration)"
