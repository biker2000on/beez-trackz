name: Build and publish images

on:
  push:
    branches: [main, rewrite/go-stack]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beez_trackz_test
          POSTGRES_USER: beez
          POSTGRES_PASSWORD: beez_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beez -d beez_trackz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test API and migrations
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://beez:beez_test@localhost:5432/beez_trackz_test?sslmode=disable
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint and build web
        working-directory: frontend
        run: |
          npm run lint
          npm run build

  api:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beez-trackz-api:latest
            ghcr.io/${{ github.repository_owner }}/beez-trackz-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beez-trackz-web:latest
            ghcr.io/${{ github.repository_owner }}/beez-trackz-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  notify-dockhand:
    needs: [api, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dockhand redeploy
        continue-on-error: true
        run: |
          curl -sS -X POST "${{ vars.DOCKHAND_WEBHOOK_URL || 'https://dock.adventureintandem.com/api/git/stacks/beez-trackz/webhook' }}" \
            || echo "Dockhand webhook returned non-200 (may need configuration)"
