name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Actions are pinned to commit SHAs (ASI-3-010): prod pulls the images this
# workflow publishes, so a hijacked action tag would flow straight to the NAS.
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beez_trackz_test
          POSTGRES_USER: beez
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beez -d beez_trackz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test API and migrations
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://beez@localhost:5432/beez_trackz_test?sslmode=disable
        run: go test ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint and build web
        working-directory: frontend
        run: |
          npm run lint
          npm run build
      - name: Install browser for navigation tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test responsive navigation
        working-directory: frontend
        run: npm run test:e2e

  # Publish jobs are gated on main itself (ASI-7-001): "not a PR" alone let
  # any branch matching the push trigger clobber :latest, which prod pulls.
  api:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beez-trackz-api:latest
            ghcr.io/${{ github.repository_owner }}/beez-trackz-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  web:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beez-trackz-web:latest
            ghcr.io/${{ github.repository_owner }}/beez-trackz-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # CI only publishes images. Deployment is a manual SSH step on the NAS —
  # see README "Deploy" — and this summary keeps that visible instead of a
  # dead webhook implying it happened (ASI-7-003).
  deploy-reminder:
    needs: [api, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Manual deploy required
        run: |
          {
            echo "## Images published — manual deploy required"
            echo ""
            echo "Pin the new build and roll it out on the NAS (see README → Deploy):"
            echo ""
            echo '```'
            echo "BEEZ_IMAGE_TAG=${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
