# Dev infrastructure for the Go rewrite. The API (backend/) and web app
# (frontend/) run locally; this provides Postgres, Redis, and MinIO.
#
# Optional Immich photo originals — set these in the local shell / .env used
# by `go run ./cmd/server` (this compose file has no API service). Empty
# defaults match production compose: MinIO unless both URL and key are set.
#   PHOTO_STORAGE_BACKEND=
#   IMMICH_BASE_URL=
#   IMMICH_API_KEY=
# The API and web development processes run on the host and read these same
# BRAND_* values from the shell/.env. This reusable map documents the exact
# container contract if either process is added to a local Compose override.
x-brand-env: &brand-env
  BRAND_DISPLAY_NAME: ${BRAND_DISPLAY_NAME:-Apiary Atlas}
  BRAND_SHORT_NAME: ${BRAND_SHORT_NAME:-Apiary Atlas}
  BRAND_TAGLINE: ${BRAND_TAGLINE:-Hive, harvest and honey records for a working apiary}
  BRAND_WORDMARK_URL: ${BRAND_WORDMARK_URL:-}
  BRAND_MARK_URL: ${BRAND_MARK_URL:-}
  BRAND_THEME_COLOR: ${BRAND_THEME_COLOR:-#d97706}
  BRAND_BACKGROUND_COLOR: ${BRAND_BACKGROUND_COLOR:-#fbf7ef}

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=beeztrackz
      - POSTGRES_PASSWORD=beeztrackz
      - POSTGRES_DB=beeztrackz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beeztrackz"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=beeztrackz
      - MINIO_ROOT_PASSWORD=beeztrackz
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local speech-to-text for the transcription task (optional in dev).
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    ports:
      - "${WHISPER_PORT:-8000}:8000"
    volumes:
      - whisper_models:/home/ubuntu/.cache/huggingface/hub

volumes:
  postgres_data:
  redis_data:
  minio_data:
  whisper_models:
