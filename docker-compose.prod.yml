# Beez Trackz — Production Docker Compose (TrueNAS / dockhand)
#
# Go API + worker, Next.js web (view layer), Postgres, Redis, MinIO.
# Traefik routes /api/* straight to the Go API and everything else to the
# Next server at https://beez.adventureintandem.com.
#
# Required in .env (dockhand: .env.dockhand):
#   POSTGRES_PASSWORD=<password>
#   SESSION_SECRET=<openssl rand -base64 32>
#   MINIO_SECRET_KEY=<openssl rand -base64 32>   (distinct from SESSION_SECRET —
#     a MinIO credential leak must not double as a session-forging key)
# Optional:
#   OIDC_ISSUER / OIDC_CLIENT_ID / OIDC_CLIENT_SECRET  (Pocket ID; empty = disabled)
#   ANTHROPIC_API_KEY / GOOGLE_AI_API_KEY / OLLAMA_URL (AI fallback keys)

x-api-env: &api-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-beeztrackz}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-beeztrackz}
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-beeztrackz}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required and must differ from SESSION_SECRET}
  MINIO_BUCKET: ${MINIO_BUCKET:-beeztrackz-media}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  APP_URL: ${APP_URL:-https://beez.adventureintandem.com}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
  OLLAMA_URL: ${OLLAMA_URL:-}
  WHISPER_URL: ${WHISPER_URL:-http://whisper:8000}

services:
  api:
    # Pin BEEZ_IMAGE_TAG to a CI-published sha in the stack .env — floating
    # on :latest turns any container restart into an unintended upgrade.
    image: ghcr.io/biker2000on/beez-trackz-api:${BEEZ_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment: *api-env
    healthcheck:
      # /healthz pings the database, so this doubles as a DB-reachability probe.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      # Keep the API route on a path-segment boundary so frontend routes such
      # as /apiaries are not captured by Traefik and sent to the Go service.
      traefik.http.routers.beez-trackz-api.rule: Host(`beez.adventureintandem.com`) && PathPrefix(`/api/`)
      traefik.http.routers.beez-trackz-api.entrypoints: websecure
      traefik.http.routers.beez-trackz-api.tls: "true"
      traefik.http.routers.beez-trackz-api.tls.certresolver: cloudflare
      traefik.http.routers.beez-trackz-api.tls.domains[0].main: adventureintandem.com
      traefik.http.routers.beez-trackz-api.tls.domains[0].sans: "*.adventureintandem.com"
      traefik.http.services.beez-trackz-api.loadbalancer.server.port: "8080"

  worker:
    image: ghcr.io/biker2000on/beez-trackz-api:${BEEZ_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    command: ["worker"]
    environment: *api-env
    healthcheck:
      test: ["CMD", "pgrep", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ghcr.io/biker2000on/beez-trackz-web:${BEEZ_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      # Next standalone binds to $HOSTNAME, which Docker sets to the
      # container id — that leaves loopback unbound and the healthcheck (and
      # anything else on 127.0.0.1) unreachable. Bind everything.
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.beez-trackz.rule: Host(`beez.adventureintandem.com`)
      traefik.http.routers.beez-trackz.entrypoints: websecure
      traefik.http.routers.beez-trackz.tls: "true"
      traefik.http.routers.beez-trackz.tls.certresolver: cloudflare
      traefik.http.routers.beez-trackz.tls.domains[0].main: adventureintandem.com
      traefik.http.routers.beez-trackz.tls.domains[0].sans: "*.adventureintandem.com"
      traefik.http.services.beez-trackz.loadbalancer.server.port: "3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beeztrackz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-beeztrackz}
    volumes:
      - ${POSTGRES_DATA_DIR:-/mnt/docker/volumes/beez-trackz/postgres-go}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beeztrackz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local speech-to-text (speaches: faster-whisper behind an OpenAI-compatible
  # API). CPU-only; not published on the host — only the api/worker reach it on
  # the compose network. The model (~1.6 GB) downloads into the cache volume on
  # first use, so the first transcription after deploy is slow.
  whisper:
    # Digest-pinned (ASI-7-004): latest-cpu floats and restart-pulls could
    # silently upgrade. Bump the digest deliberately.
    image: ghcr.io/speaches-ai/speaches:latest-cpu@sha256:1d4f852ff5b148d675bcd751f414835c0bcef2541c1df8ffdeb43714968aafe6
    restart: unless-stopped
    # The ~1.6 GB model plus inference is the stack's biggest memory user;
    # bound it so a runaway transcription cannot take down the NAS.
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub

  minio:
    # Digest-pinned (ASI-7-004): MinIO has shipped breaking releases and
    # restart-pulls could silently upgrade. Bump the digest deliberately.
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-beeztrackz}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required and must differ from SESSION_SECRET}
    volumes:
      - ${MINIO_DATA_DIR:-/mnt/docker/volumes/beez-trackz/minio}:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  whisper-models:
